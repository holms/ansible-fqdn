---
all:
  children:
    molecule:
      hosts:
        molecule-debian12:
          ansible_connection: containers.podman.podman
          ansible_host: molecule-debian12
          container_image: docker.io/geerlingguy/docker-debian12-ansible:latest
          container_command: /lib/systemd/systemd
        molecule-rockylinux9:
          ansible_connection: containers.podman.podman
          ansible_host: molecule-rockylinux9
          container_image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
          container_command: /usr/lib/systemd/systemd
        molecule-ubuntu2404:
          ansible_connection: containers.podman.podman
          ansible_host: molecule-ubuntu2404
          container_image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
          container_command: /lib/systemd/systemd
