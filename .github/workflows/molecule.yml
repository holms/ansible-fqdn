---
name: Molecule

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install containers.podman ansible.windows

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          runner_user="$(id -un)"
          grep -q "^${runner_user}:" /etc/subuid || echo "${runner_user}:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^${runner_user}:" /etc/subgid || echo "${runner_user}:100000:65536" | sudo tee -a /etc/subgid

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Molecule
        run: molecule test
